# Logs go to the host journal, so they survive `docker compose up` recreating
# a container (the json-file log is deleted with the container).
# Read them with `docker compose logs` or `journalctl CONTAINER_NAME=...`.
x-logging: &logging
  driver: journald

services:
  postgresql:
    logging: *logging
    container_name: postfix-dockerize-postgresql
    image: postgres:18
    restart: always
    environment:
     - POSTGRES_DB=mail
     - POSTGRES_USER=mail
     - POSTGRES_PASSWORD=${DB_PASSWORD:-somePassword}
    volumes:
      # Required: a missing value must not silently start an empty database.
      - ${DATA_DIR_DB:?set DATA_DIR_DB in .env}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail"]
      interval: 10s
      timeout: 5s
      retries: 5
  postfix:
    # Never built here: build a tagged release with `./build.sh <tag>` and set
    # POSTFIX_IMAGE in .env. (With `build:` present, compose rebuilt the image
    # even when ${POSTFIX_IMAGE} already existed.) tests/ adds `build:` back.
    image: ${POSTFIX_IMAGE:-postfix:local}
    pull_policy: never
    logging: *logging
    container_name: postfix-dockerize-postfix
    restart: always
    networks:
      default:
        # Lets roundcube reach postfix by the name in its TLS certificate,
        # so STARTTLS certificate verification succeeds.
        aliases:
          - ${MYHOSTNAME:-mailserver.example.org}
    depends_on:
      postgresql:
        condition: service_healthy
      postfixadmin:
        condition: service_started
    environment:
      - MYDOMAIN=${MYDOMAIN:-example.org}
      - MYORIGIN=${MYORIGIN:-${MYDOMAIN:-example.org}}
      - MYHOSTNAME=${MYHOSTNAME:-mailserver.example.org}
      - PGHOST=postgresql
      - PGPORT=5432
      - PGUSER=mail
      - PGPASS=${DB_PASSWORD:-somePassword}
      - PGDATABASE=mail
      - SMTPD_TLS_CERT_FILE=/tmp/cert.pem
      - SMTPD_TLS_KEY_FILE=/tmp/key.pem
      - DOVECOT_DH_FILE=/tmp/dh4096.pem
      - MESSAGE_SIZE_LIMIT=20480000
      - VIRTUAL_MAILBOX_BASE=/var/mailstorage
    volumes:
      - ${DATA_DIR_MAIL:?set DATA_DIR_MAIL in .env}:/var/mailstorage
      - type: bind
        source: /etc/dkim
        target: /etc/dkim
        read_only: true
      - type: bind
        source: /etc/dhparam/dh4096.pem
        target: /tmp/dh4096.pem
        read_only: true
      - type: bind
        source: /etc/letsencrypt/live/${CERT_NAME:-${MYDOMAIN:-example.org}}/privkey.pem
        target: /tmp/key.pem
        read_only: true
      - type: bind
        source: /etc/letsencrypt/live/${CERT_NAME:-${MYDOMAIN:-example.org}}/fullchain.pem
        target: /tmp/cert.pem
        read_only: true
    ports:
      # smtp
      - "25:25"
      # submission port
      - "587:587"
      # Dovecot imap
      - "993:993"
    healthcheck:
      # Kept silent on purpose: `postfix status` and connecting to 587 both write
      # log lines on every run. Instead check that the postfix master is alive and
      # that 587 is in LISTEN state in /proc/net/tcp (:024B = 587, 0A = LISTEN).
      test: ["CMD-SHELL", "kill -0 $$(cat /var/spool/postfix/pid/master.pid) && dovecot service status && grep -qE ':024B [0-9A-F]+:[0-9A-F]+ 0A ' /proc/net/tcp && nc -z localhost 993"]
      interval: 30s
      timeout: 5s
      retries: 5

  postfixadmin:
    container_name: postfix-dockerize-postfixadmin
    image: "postfixadmin:latest"
    restart: always
    logging: *logging
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - POSTFIXADMIN_DB_TYPE=pgsql
      - POSTFIXADMIN_DB_HOST=postgresql
      - POSTFIXADMIN_DB_USER=mail
      - POSTFIXADMIN_DB_PASSWORD=${DB_PASSWORD:-somePassword}
      - POSTFIXADMIN_DB_NAME=mail
      - POSTFIXADMIN_ENCRYPT=php_crypt:BLOWFISH:10:{BLF-CRYPT}
    ports:
     - "8181:80"

  roundcube:
    container_name: postfix-dockerize-roundcube
    image: roundcube/roundcubemail:latest
    restart: always
    logging: *logging
    depends_on:
      postfix:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=pgsql
      - ROUNDCUBEMAIL_DB_HOST=postgresql
      - ROUNDCUBEMAIL_DB_USER=mail
      - ROUNDCUBEMAIL_DB_PASSWORD=${DB_PASSWORD:-somePassword}
      - ROUNDCUBEMAIL_DB_NAME=mail
      - ROUNDCUBEMAIL_DB_PREFIX=rc_
      - ROUNDCUBEMAIL_DEFAULT_HOST=postfix
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://${MYHOSTNAME:-mailserver.example.org}
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_SKIN=elastic
    ports:
      - "8182:80"
